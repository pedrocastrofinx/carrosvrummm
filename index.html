<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dryve Assinatura Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Ir para o conteúdo</a>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navegação principal">
    <a class="brand" href="#/" aria-label="Dryve Assinatura Hub">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-txt"><strong>DRYVE</strong><small>Assinatura Hub</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot"><button class="rail-btn" data-act="rail" id="railBtn" aria-label="Expandir ou recolher menu"></button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="menu" aria-label="Abrir menu" id="menuBtn"></button>
      <div class="ptitle"><strong id="pTitle">Home</strong><span id="pDate"></span></div>
      <div class="gsearch">
        <span class="gs-ico" id="gsIco"></span>
        <input id="gsearch" type="search" autocomplete="off" placeholder="Buscar veículo, vídeo ou locadora   /" aria-label="Busca global">
        <div class="gs-pop" id="gsPop" hidden></div>
      </div>
      <div class="top-actions">
        <div class="pop-wrap">
          <button class="btn ghost" data-act="recentes" id="btnRecentes"></button>
          <div class="pop" id="popRecentes" hidden></div>
        </div>
        <a class="btn clove-btn" href="#/clove" id="btnClove"></a>
        <div class="pop-wrap">
          <button class="user" data-act="userMenu" id="userBtn"></button>
          <div class="pop right" id="popUser" hidden></div>
        </div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="confirmRoot"></div>
<div id="toasts" aria-live="polite"></div>
<script src="js/boot.js"></script>
<noscript>O Dryve Hub precisa de JavaScript para funcionar.</noscript>
</body>
</html>
